name: CBSE Edu Desk native Android APK

on:
  workflow_dispatch:
  push:
    branches: [ private-messenger ]
    paths:
      - 'native-app/**'
      - '.github/workflows/native-app.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android SDK
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses
      - name: Build CBSE Edu Desk APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon -p native-app :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cbse-edu-desk-native-debug-apk
          path: native-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
