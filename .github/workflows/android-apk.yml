name: Android APK build

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Verify submodules
        run: |
          git submodule status --recursive
          test -f TMessagesProj/jni/CMakeLists.txt
          test -d TMessagesProj_Modules/media

      - name: Build Telegram debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :TMessagesProj_App:assembleAfatDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: TMessagesProj_App/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 14
